name: Build bgce

on:
  push:
    branches: [ main ]
    paths: [ 'bgce.m', '.github/workflows/build.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build bgce.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -isysroot "$SDK" \
                -dynamiclib -fobjc-arc \
                -Wno-deprecated-declarations \
                -install_name @rpath/bgce.dylib \
                -framework UIKit \
                -framework Foundation \
                -framework AVFoundation \
                -o bgce.dylib \
                bgce.m
          ls -la bgce.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: bgce.dylib
          path: bgce.dylib
